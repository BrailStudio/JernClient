name: Build installers

# Builds the Windows installers (.exe + .msi) on a GitHub-hosted Windows machine.
#  - Push a tag like v1.3.0      -> builds AND publishes a GitHub Release with the files attached.
#  - "Run workflow" button       -> builds only; download the files from the run's "Artifacts" section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) {
            Write-Error "Tag $($env:TAG) does not match package.json version $v. Change one of them and tag again."
            exit 1
          }
          Write-Host "Version OK: $v"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js

      - name: Build installers (.exe and .msi)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate configured

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          $files = Get-ChildItem "Jern-Client-Setup-*.exe", "Jern-Client-Setup-*.msi"
          if ($files.Count -lt 2) { Write-Error "Expected an .exe and an .msi in dist/, found $($files.Count)"; exit 1 }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jern-client-installers
          path: |
            dist/Jern-Client-Setup-*.exe
            dist/Jern-Client-Setup-*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem "dist\Jern-Client-Setup-*.exe", "dist\Jern-Client-Setup-*.msi", "dist\SHA256SUMS.txt" | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
          } else {
            gh release create $env:TAG $files --title "Jern Client $($env:TAG)" --generate-notes
          }
