
name: Build JernClient Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build Windows installers
      - name: Build EXE and MSI
        run: npm run dist -- --publish never

      # 5. Upload installers as workflow artifacts
      - name: Upload Installers
        uses: actions/upload-artifact@v4
        with:
          name: JernClient-Windows-Installers
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
          retention-days: 30

      # 6. Publish GitHub Release when a version tag is pushed
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*.exe
            dist/*.msi
          generate_release_notes: true
