<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jern Client</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
:root{--bg:#181b21;--rail:#12141a;--surf:#21252e;--surf2:#2a2f3a;--line:#333a47;--blue:#2b6de0;--blue2:#4a85ee;--text:#f2f4f8;--mute:#8b93a4;--bad:#ef6a5b;--ok:#3ec98a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#363c4a;border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#464e60}
.ic{display:inline-grid;place-items:center;flex:none}.ic svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* top bar + rail */
#topbar{height:40px;flex:none;background:var(--rail);display:flex;align-items:center;gap:4px;padding:0 150px 0 12px;-webkit-app-region:drag}
#topbar>*{-webkit-app-region:no-drag}
.tbt{margin-left:10px;color:var(--mute);font-size:13px;font-weight:600;-webkit-app-region:drag}
.tbb{width:32px;height:30px;border:0;background:none;border-radius:8px;color:var(--text);display:grid;place-items:center}
.tbb:hover:not(:disabled){background:var(--surf2)}.tbb:disabled{color:#555b69;cursor:default}
.tbb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#main{flex:1;display:flex;min-height:0}
#rail{width:76px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.logo{width:46px;height:46px;border-radius:12px;margin-bottom:14px;cursor:pointer}
.nav{width:52px;height:52px;border:0;background:none;border-radius:14px;color:var(--mute);display:grid;place-items:center;position:relative}
.nav:hover{background:var(--surf);color:var(--text)}.nav.on{background:var(--surf);color:var(--blue2)}
.nav.on::before{content:"";position:absolute;left:-12px;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--blue2)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#me{margin-top:auto;border:0;background:none;padding:0;border-radius:12px}
#page{flex:1;overflow:auto;padding:26px 34px 40px}
#page.fade>*{animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* controls */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:26px;margin:0;font-weight:700;flex:1;white-space:nowrap}
.btn{border:0;background:var(--surf2);border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){background:#363c4b}.btn.pri{background:var(--blue)}.btn.pri:hover:not(:disabled){background:var(--blue2)}
.btn.bad{color:var(--bad)}.btn:disabled{opacity:.55;cursor:default}.btn.big{padding:13px 30px;font-size:16px;border-radius:12px}
.ibtn{width:42px;height:42px;border:0;background:#0003;border-radius:11px;display:grid;place-items:center;color:var(--text)}
.ibtn:hover{background:#0006}.ibtn.bad:hover{color:var(--bad)}
input,select{background:var(--surf);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
input[type=text],input[type=password],input:not([type]){width:100%}
select{cursor:pointer}input:focus,select:focus{border-color:var(--blue2);outline:none}
label.f{display:block;color:var(--mute);margin:14px 0 5px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--mute)}
.sbox:focus-within{border-color:var(--blue2);color:var(--text)}
.sbox input{background:none;border:0;padding:12px 0;outline:none;flex:1;min-width:0}.sbox.sm input{padding:9px 0;width:180px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:600}
.tab:hover{background:var(--surf)}.tab.on{background:var(--surf);color:var(--text);box-shadow:inset 0 -2px var(--blue2)}
.sub{color:var(--mute);font-size:13px;display:block}.dim{opacity:.75}
.msg{color:var(--mute);margin:0 0 14px}.msg.e{color:var(--bad)}
.list{display:grid;gap:10px}
.crumb{background:none;border:0;color:var(--mute);padding:0;font-weight:600}.crumb:hover{color:var(--text)}.crumbs{color:var(--mute);margin-bottom:14px}
.empty{text-align:center;padding:50px 20px;color:var(--mute);background:var(--surf);border-radius:16px}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
/* switch */
.tgl{width:40px;height:22px;border-radius:12px;border:0;background:#3b4252;position:relative;flex:none;padding:0}
.tgl i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl.on{background:var(--blue)}.tgl.on i{transform:translateX(18px)}
/* instances */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--surf);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;transition:transform .14s,box-shadow .14s;border:0;text-align:left;color:inherit}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0006}
.cover{position:relative;overflow:hidden}.cover .cv{position:absolute;right:-6px;bottom:-14px;font-size:64px;font-weight:800;color:#ffffff22;letter-spacing:-2px}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:4px;background:#0007;backdrop-filter:blur(6px);padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.bdg.boost{background:var(--blue)}
.card .in{padding:12px 14px 14px}.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.card .play{position:absolute;right:12px;top:84px;width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.14s;box-shadow:0 6px 18px #0007;font-size:18px}
.card:hover .play,.card .play:focus-visible{opacity:1;transform:none}
.card.add{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:200px;border:2px dashed var(--line);background:none;color:var(--mute);font-size:15px}
.card.add:hover{border-color:var(--blue2);color:var(--text);box-shadow:none;transform:none}.card.add .ic svg{width:26px;height:26px}
/* home */
.homehero{display:flex;gap:22px;align-items:center;padding:28px;border-radius:20px;margin-bottom:26px;background:linear-gradient(120deg,color-mix(in srgb,var(--blue) 75%,#000),#1a2540 80%)}
.homehero .hl{width:76px;height:76px;border-radius:18px}.homehero h1{margin:0 0 4px;font-size:26px}.homehero p{margin:0;opacity:.8}
h2.sec{font-size:17px;margin:0 0 12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:28px}
.tile{background:var(--surf);border:0;border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile:hover{background:var(--surf2)}.tile .ic{color:var(--blue2)}.tile .ic svg{width:26px;height:26px}.tile b{font-size:15px}
.note{background:var(--surf);border-radius:16px;padding:16px 18px;margin-bottom:26px;display:flex;gap:14px;align-items:center}
.note.warn{box-shadow:inset 0 0 0 1px #ef6a5b66}
/* instance detail */
.dhead{border-radius:20px;padding:22px;margin-bottom:18px}
.dtop{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dhead .big{width:84px;height:84px;border-radius:20px;background:#0003;display:grid;place-items:center;font-size:36px;font-weight:800}
.dhead h1{margin:0 0 8px;font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;background:#0004;padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:600}
.lp{margin-top:16px;display:flex;gap:14px;align-items:center}.lp span{font-size:13px;min-width:0;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#0005;border-radius:4px;flex:1;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .2s}
.crow{display:flex;gap:14px;align-items:center;background:var(--surf);border-radius:12px;padding:11px 14px}
.crow.off .t{opacity:.5}.crow .t{flex:1;min-width:0}.crow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.crow small{color:var(--mute)}
.scard{background:var(--surf);border-radius:16px;padding:20px 22px;margin-bottom:16px;max-width:760px}.scard h3{margin:0 0 4px;font-size:16px}
.swatches{display:flex;gap:10px;margin-top:6px}.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:#fff}
.item{display:flex;gap:14px;align-items:center;background:var(--surf2);border-radius:12px;padding:10px 14px}.item .t{flex:1}
pre{background:#101217;border-radius:14px;padding:14px;height:340px;overflow:auto;font:12px/1.5 Consolas,monospace;color:#b9c2d0;white-space:pre-wrap;margin:0}
/* browse (Modrinth style) */
.hit{display:grid;grid-template-columns:92px 1fr auto;gap:18px;background:var(--surf);border-radius:16px;padding:16px;align-items:center;transition:background .12s}
.hit:hover{background:#262b36}.hit>img{width:92px;height:92px;border-radius:14px;object-fit:cover;background:var(--surf2)}
.ht{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hn{font-size:18px;font-weight:700;color:var(--text);text-decoration:none}.hn:hover{color:var(--blue2);text-decoration:underline}.by{color:var(--mute)}
.hd{margin:4px 0 10px;color:#c0c6d2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--surf2);border:1px solid var(--line);border-radius:20px;padding:1px 11px;font-size:12.5px;text-transform:capitalize}
.tag.loader{color:#f0b07a;border-color:#f0b07a55}.tag.env{color:#9fb3c8}
.hs{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:150px}.hs .r{display:flex;gap:16px}
.stat{display:flex;gap:6px;align-items:center;color:#c9cfdb;font-weight:600}.stat.dim{color:var(--mute);font-weight:400}
.sk{height:124px;background:linear-gradient(90deg,var(--surf) 25%,#2a2f3a 50%,var(--surf) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.pager{display:flex;gap:4px;align-items:center}
.pg{min-width:38px;height:38px;border-radius:50%;border:0;background:none;font-weight:600;color:#c9cfdb;padding:0 6px}
.pg:hover:not(:disabled){background:var(--surf2)}.pg.on{background:var(--blue);color:#fff}.pg:disabled{opacity:.3;cursor:default}.dots{color:var(--mute);padding:0 4px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 14px}.ctl .sp{flex:1}
.cnt{color:var(--mute);margin:0 0 10px}
.ck{display:inline-flex;gap:8px;align-items:center;color:var(--mute)}
/* modal, accounts */
#veil{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:10}#veil.on{display:grid}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(460px,92vw);max-height:90vh;overflow:auto}.modal h2{margin:0 0 6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surf2);padding:11px 20px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0008;max-width:80vw}.toast.err{background:#5a2a2a}
.av{display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
#pop{position:fixed;left:86px;bottom:14px;width:330px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px;display:none;z-index:9;box-shadow:0 12px 40px #0008}#pop.on{display:block}
.ph{color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px 8px}
.acc{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer}
.acc:hover{background:var(--surf2)}.acc.on{background:#2b6de02b;box-shadow:inset 0 0 0 1px #2b6de088}
.acc .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chk{color:var(--blue2);font-weight:800}
.acc .x{border:0;background:none;color:var(--mute);width:26px;height:26px;border-radius:8px;opacity:0}.acc:hover .x,.acc .x:focus-visible{opacity:1}.acc .x:hover{color:var(--bad);background:#0003}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:#ffffff14;color:var(--mute)}.pill.ms{background:#3ec98a22;color:var(--ok)}.pill.ely{background:#4a85ee26;color:var(--blue2)}
.addacc{width:100%;margin-top:8px;padding:11px}
.prov{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:14px}
.prov:hover{border-color:var(--blue2);background:var(--surf2)}.prov .t{flex:1}.prov small{display:block;color:var(--mute)}.prov .arr{color:var(--mute);font-size:22px}
.pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--surf2)}.pi.ms{background:#3ec98a26;color:var(--ok)}.pi.ely{background:#4a85ee33;color:var(--blue2)}

.crow .cicon{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--surf2);flex:none}
.crow .ct{display:flex;gap:8px;align-items:center;min-width:0}.crow .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{font:11px Consolas,monospace;background:#0004;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:#b4bccb;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.crow small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .acts{display:flex;gap:10px;align-items:center}.crow .ibtn{background:none;width:36px;height:36px;color:var(--mute)}.crow .ibtn:hover{background:var(--surf2);color:var(--text)}.crow .ibtn.bad:hover{color:var(--bad)}
.upd{width:36px;height:36px;border-radius:10px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}.upd:hover:not(:disabled){background:var(--blue2)}.upd:disabled{opacity:.6}
@media (max-width:900px){.hit{grid-template-columns:72px 1fr}.hit>img{width:72px;height:72px}.hs{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const call=window.jern.call;
const c=async(k,a)=>{const r=await call(k,a);if(!r.ok)throw new Error(r.error);return r.data};
const E=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a==='text')e.textContent=v;else if(a.startsWith('on'))e[a]=v;else if(a==='style')e.style.cssText=v;else if(v===false||v==null){}else e.setAttribute(a,v===true?'':v)}e.append(...k.flat().filter(x=>x!=null&&x!==false&&x!==true&&x!==0));return e};
// optional children like (cond && element) can be false/0: never print them as text
for(const m of ['replaceChildren','append','prepend']){const o=Element.prototype[m];Element.prototype[m]=function(...k){return o.apply(this,k.flat().filter(x=>x!=null&&x!==false&&x!==true&&x!==0))}}
const $=s=>document.querySelector(s);
let V,ACC={list:[],sel:null},INST=[],view='inst',cur=null,LOG='',state={},B={src:'modrinth',type:'mod',q:'',target:null,page:1,per:20,sort:'relevance',cat:'',compat:true},CFG={};
const TYPES=[['mod','Mods'],['resourcepack','Resource packs'],['shader','Shaders'],['modpack','Modpacks']];
const hue=s=>[...s].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7)%360;
const grad=s=>{const h=hue(s);return`linear-gradient(135deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 60% 24%))`};
const toast=(m,k='')=>{const t=E('div',{class:'toast '+k,text:m});document.body.append(t);setTimeout(()=>t.remove(),k==='err'?5000:3000)};
const loaderName=i=>i.loader==='vanilla'?'Vanilla':i.loader[0].toUpperCase()+i.loader.slice(1);

/* ---------- accounts ---------- */
const TL={ms:'Microsoft',ely:'Ely.by',offline:'Offline'};
let askRes=null;
const close=()=>{$('#veil').classList.remove('on');if(askRes){askRes(false);askRes=null}};
function modal(...k){const m=$('#modal');m.replaceChildren(...k);$('#veil').classList.add('on')}
$('#veil').onclick=e=>{if(e.target.id==='veil')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function ask(title,text,ok='OK'){return new Promise(res=>{askRes=res;const done=v=>{askRes=null;close();res(v)};
 modal(E('h2',{text:title}),E('p',{class:'msg',text}),E('div',{class:'row'},E('button',{class:'btn bad',text:ok,onclick:()=>done(true)}),E('button',{class:'btn',text:'Cancel',onclick:()=>done(false)})))})}
function avatar(a,s=40){
 const d=E('div',{class:'av',style:`width:${s}px;height:${s}px;border-radius:${Math.round(s/4)}px;font-size:${Math.round(s*.4)}px;background:var(--surf2)`});
 if(!a){d.textContent='+';return d}
 d.textContent=a.name[0].toUpperCase();

function pageBrowse(){const P=$('#page');
